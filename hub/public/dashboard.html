<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Mes projets</title><link rel="stylesheet" href="/assets/hub.css"></head>
<body><div class="wrap"><div class="head"><h1>Mes projets</h1><button class="btn ghost" id="out">Déconnexion</button></div>
<div class="grid" id="grid"><p class="vide">Chargement…</p></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/hub/projets').then(r=>r.ok?r.json():Promise.reject()).then(list=>{
  document.getElementById('grid').innerHTML=list.length?list.map(p=>`<div class="card"><div class="st">● ${esc(p.statut)}</div><h2>${esc(p.nom)}</h2><p>${esc(p.description)}</p>
  <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  <a class="btn" href="${esc(p.url)}">Ouvrir</a></div>`).join(''):'<p class="vide">Aucun projet.</p>';
}).catch(()=>location.reload());
document.getElementById('out').onclick=()=>fetch('/hub/logout',{method:'POST'}).then(()=>location.reload());
</script></body></html>
