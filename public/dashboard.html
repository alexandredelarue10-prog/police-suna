<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-body">
    <div class="wrap" style="padding-top:40px">
      <div class="section-head">
        <div>
          <h1 id="welcome-title" class="mb-0">Bienvenue</h1>
          <p class="muted" id="welcome-sub"></p>
        </div>
      </div>

      <div id="pending-alert"></div>

      <div id="annonces-section" class="hidden" style="margin-bottom:32px">
        <div class="section-head">
          <h2 class="mb-0" style="font-size:1.1rem">Annonces internes</h2>
          <button class="btn btn-secondary btn-sm hidden" id="new-annonce-btn">+ Publier</button>
        </div>
        <div id="annonces-list"></div>
      </div>

      <div class="grid grid-3" id="quick-links"></div>

      <div id="recent-activity-section" class="hidden" style="margin-top:36px">
        <div class="section-head">
          <h2 class="mb-0" style="font-size:1.1rem">Activité récente</h2>
          <a href="journal.html" style="font-size:0.85rem">Voir tout le journal →</a>
        </div>
        <div id="recent-activity-list"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="annonce-modal">
    <div class="modal">
      <h3>Nouvelle annonce interne</h3>
      <form id="annonce-form">
        <div class="field"><label for="a-titre">Titre *</label><input type="text" id="a-titre" required /></div>
        <div class="field"><label for="a-contenu">Contenu *</label><textarea id="a-contenu" rows="4" required></textarea></div>
        <div class="modal-close-row">
          <button type="button" class="btn btn-secondary" id="annonce-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Publier</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const user = await initLayout({ activeKey: 'dashboard', requireAuth: true });
      if (!user) return;

      document.getElementById('welcome-title').textContent = `Bienvenue, ${user.nom_complet || user.username}`;
      document.getElementById('welcome-sub').textContent =
        `${user.grade_nom || 'Sans grade'} · Matricule ${user.matricule || '—'}`;

      const links = [
        { href: 'casiers.html', title: 'Casiers judiciaires', desc: 'Consulter et gérer les dossiers des suspects.', show: true },
        { href: 'plaintes.html', title: 'Dépôts de plainte', desc: 'Enregistrer une plainte avec témoignages et infractions.', show: true },
        { href: 'administratif.html', title: 'Pôle Administratif', desc: 'Rapport des amendes et gestion des formations.', show: user.poles.includes('Administratif') },
        { href: 'enquetes.html', title: 'Pôle Enquête', desc: "Dossiers d'enquête reliant casiers et plaintes.", show: user.poles.includes('Enquête') },
        { href: 'securite.html', title: 'Pôle Sécurité', desc: 'Incidents de sécurité et patrouilles.', show: user.poles.includes('Sécurité') },
        { href: 'organigramme.html', title: 'Organigramme', desc: 'Hiérarchie complète des forces de police.', show: true },
        { href: 'profil.html', title: 'Mon profil', desc: 'Modifier votre mot de passe.', show: true },
        { href: 'admin-comptes.html', title: 'Gestion des comptes', desc: 'Valider les demandes et attribuer les grades.', show: user.permissions.peut_valider_comptes },
        { href: 'admin-grades.html', title: 'Gestion des grades', desc: 'Créer, modifier ou supprimer des grades.', show: user.permissions.peut_gerer_grades },
        { href: 'admin-rangs.html', title: 'Gestion des rangs ninja', desc: 'Créer, modifier ou supprimer des rangs (Genin, Chûnin…).', show: user.permissions.peut_gerer_grades },
        { href: 'code-penal.html', title: 'Code pénal', desc: 'Modifier les articles, blâmes et paliers de récidive.', show: user.permissions.peut_gerer_sanctions },
        { href: 'protocoles.html', title: 'Protocoles', desc: "Modifier les codes d'alerte.", show: user.permissions.peut_gerer_protocoles },
        { href: 'admin-actus.html', title: 'Communiqués', desc: 'Publier des actualités officielles.', show: user.permissions.peut_gerer_actus },
      ];

      document.getElementById('quick-links').innerHTML = links.filter(l => l.show).map(l => `
        <a href="${l.href}" class="card" style="display:block">
          <h3 style="font-size:1.05rem; margin-bottom:8px">${escapeHtml(l.title)}</h3>
          <p class="muted mb-0" style="font-size:0.86rem">${escapeHtml(l.desc)}</p>
        </a>
      `).join('');

      if (user.permissions.peut_valider_comptes) {
        try {
          const { users } = await api('/users');
          const pending = users.filter(u => u.statut === 'en_attente');
          if (pending.length > 0) {
            document.getElementById('pending-alert').innerHTML = `
              <div class="alert alert-info">
                ${pending.length} demande(s) de compte en attente de validation.
                <a href="admin-comptes.html">Traiter les demandes →</a>
              </div>`;
          }
        } catch (_) { /* silencieux */ }

        try {
          const { entries } = await api('/journal?limit=5');
          if (entries.length > 0) {
            document.getElementById('recent-activity-section').classList.remove('hidden');
            document.getElementById('recent-activity-list').innerHTML = entries.map(e => `
              <div class="flex-between" style="padding:10px 0; border-bottom:1px solid rgba(217,192,139,0.12)">
                <div>
                  <span class="badge badge-muted">${escapeHtml(e.action_label)}</span>
                  <span style="font-size:0.85rem; margin-left:6px">${escapeHtml(e.details || '')}</span>
                </div>
                <span class="muted" style="font-size:0.76rem; white-space:nowrap">${escapeHtml(e.username_snapshot || '—')} · ${formatDateTime(e.created_at)}</span>
              </div>
            `).join('');
          }
        } catch (_) { /* silencieux */ }
      }

      if (user.permissions.peut_gerer_actus) {
        document.getElementById('new-annonce-btn').classList.remove('hidden');
        document.getElementById('new-annonce-btn').addEventListener('click', () => {
          document.getElementById('annonce-form').reset();
          document.getElementById('annonce-modal').classList.add('open');
        });
        document.getElementById('annonce-cancel').addEventListener('click', () => document.getElementById('annonce-modal').classList.remove('open'));
        document.getElementById('annonce-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await api('/interne/annonces', {
              method: 'POST',
              body: { titre: document.getElementById('a-titre').value.trim(), contenu: document.getElementById('a-contenu').value.trim() },
            });
            toast('Annonce publiée.');
            document.getElementById('annonce-modal').classList.remove('open');
            loadAnnonces();
          } catch (err) { toast(err.message, 'error'); }
        });
      }
      loadAnnonces();
    })();

    async function loadAnnonces() {
      try {
        const { annonces } = await api('/interne/annonces');
        if (annonces.length === 0) return;
        document.getElementById('annonces-section').classList.remove('hidden');
        document.getElementById('annonces-list').innerHTML = annonces.slice(0, 5).map(a => `
          <div class="card" style="margin-bottom:10px">
            <div class="flex-between" style="align-items:flex-start">
              <div>
                <strong style="font-size:0.95rem">${escapeHtml(a.titre)}</strong>
                <p class="muted mb-0" style="font-size:0.76rem">${escapeHtml(a.auteur_username || '—')} · ${formatDateTime(a.created_at)}</p>
              </div>
              ${CURRENT_USER.permissions.peut_gerer_actus ? `<button class="btn btn-danger btn-sm" data-del-annonce="${a.id}">✕</button>` : ''}
            </div>
            <p style="font-size:0.86rem; margin-top:6px">${escapeHtml(a.contenu)}</p>
          </div>
        `).join('');
        document.querySelectorAll('[data-del-annonce]').forEach(btn => {
          btn.addEventListener('click', async () => {
            try { await api(`/interne/annonces/${btn.dataset.delAnnonce}`, { method: 'DELETE' }); loadAnnonces(); } catch (err) { toast(err.message, 'error'); }
          });
        });
      } catch (_) { /* silencieux */ }
    }
  </script>
</body>
</html>
