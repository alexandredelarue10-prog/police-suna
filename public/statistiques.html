<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statistiques — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .bar-row { display: grid; grid-template-columns: 140px 1fr 50px; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(0,0,0,0.25); overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--argile-600), var(--argile-500)); }
    .bar-label { font-size: 0.82rem; }
    .bar-value { font-size: 0.78rem; text-align: right; color: var(--or-300); font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="page-body">
    <div class="wrap" style="padding-top:40px">
      <h1>Statistiques</h1>
      <p class="muted" style="margin-bottom:28px">Aperçu de l'activité judiciaire du village.</p>

      <div class="stat-row" id="totaux-row">
        <div class="stat-box"><span class="n">—</span><span class="l">Casiers ouverts</span></div>
        <div class="stat-box"><span class="n">—</span><span class="l">Individus recherchés</span></div>
        <div class="stat-box"><span class="n">—</span><span class="l">Infractions enregistrées</span></div>
        <div class="stat-box"><span class="n">—</span><span class="l">Agents actifs</span></div>
      </div>

      <div class="grid grid-2" style="margin-top:20px">
        <div class="card">
          <h3 style="font-size:1rem">Infractions par catégorie</h3>
          <div id="cat-chart" style="margin-top:16px"><div class="loader">Chargement…</div></div>
        </div>
        <div class="card">
          <h3 style="font-size:1rem">Infractions des 6 derniers mois</h3>
          <div id="mois-chart" style="margin-top:16px"><div class="loader">Chargement…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const user = await initLayout({ activeKey: 'statistiques', requireAuth: true });
      if (!user) return;
      loadStats();
    })();

    async function loadStats() {
      try {
        const { parCategorie, parMois, totaux } = await api('/stats');

        const boxes = document.querySelectorAll('#totaux-row .n');
        boxes[0].textContent = totaux.total_casiers;
        boxes[1].textContent = totaux.total_recherches;
        boxes[2].textContent = totaux.total_infractions;
        boxes[3].textContent = totaux.total_agents;

        renderBars('cat-chart', parCategorie.map(c => ({ label: c.categorie, value: c.total })));
        renderBars('mois-chart', parMois.map(m => ({ label: m.mois, value: m.total })));
      } catch (err) {
        document.getElementById('cat-chart').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderBars(containerId, data) {
      const container = document.getElementById(containerId);
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune donnée pour le moment.</div>';
        return;
      }
      const max = Math.max(...data.map(d => d.value), 1);
      container.innerHTML = data.map(d => `
        <div class="bar-row">
          <span class="bar-label">${escapeHtml(d.label)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round((d.value / max) * 100)}%"></div></div>
          <span class="bar-value">${d.value}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
