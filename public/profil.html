<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon profil — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-body">
    <div class="wrap" style="padding-top:40px; max-width:520px">
      <h1>Mon profil</h1>

      <div class="card" style="margin-bottom:24px" id="profile-info"></div>

      <div class="card dark-form">
        <h3 style="font-size:1.05rem">Changer mon mot de passe</h3>
        <div id="pw-error"></div>
        <form id="pw-form">
          <div class="field">
            <label for="current_password">Mot de passe actuel</label>
            <input type="password" id="current_password" required />
          </div>
          <div class="field">
            <label for="new_password">Nouveau mot de passe</label>
            <input type="password" id="new_password" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-primary">Mettre à jour</button>
        </form>
      </div>

      <div class="card dark-form hidden" id="credits-card" style="margin-top:24px">
        <h3 style="font-size:1.05rem">Crédits du site (pied de page)</h3>
        <p class="field-hint" style="margin-bottom:12px">Visible en bas de chaque page. Réservé au compte DEV.</p>
        <div id="credits-error"></div>
        <form id="credits-form">
          <div class="field">
            <label for="credits-text">Texte des crédits</label>
            <textarea id="credits-text" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const user = await initLayout({ activeKey: '', requireAuth: true });
      if (!user) return;

      document.getElementById('profile-info').innerHTML = `
        <div class="grid grid-2">
          <div><strong>Nom d'utilisateur</strong><p class="mb-0">${escapeHtml(user.username)}</p></div>
          <div><strong>Nom complet</strong><p class="mb-0">${escapeHtml(user.nom_complet || '—')}</p></div>
          <div><strong>Grade</strong><p class="mb-0">${escapeHtml(user.grade_nom || 'Sans grade')}</p></div>
          <div><strong>Rang ninja</strong><p class="mb-0">${escapeHtml(user.rang_nom || '—')}</p></div>
          <div><strong>Matricule</strong><p class="mb-0">${escapeHtml(user.matricule || '—')}</p></div>
        </div>`;

      if (user.protege) {
        document.getElementById('credits-card').classList.remove('hidden');
        try {
          const { credits } = await api('/settings/credits');
          document.getElementById('credits-text').value = credits;
        } catch (_) { /* silencieux */ }
      }
    })();

    document.getElementById('credits-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('credits-error');
      errorBox.innerHTML = '';
      try {
        await api('/settings/credits', { method: 'PUT', body: { valeur: document.getElementById('credits-text').value } });
        toast('Crédits mis à jour.');
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    });

    document.getElementById('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('pw-error');
      errorBox.innerHTML = '';
      try {
        await api('/users/me/password', {
          method: 'PATCH',
          body: {
            current_password: document.getElementById('current_password').value,
            new_password: document.getElementById('new_password').value,
          },
        });
        toast('Mot de passe mis à jour.');
        document.getElementById('pw-form').reset();
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    });
  </script>
</body>
</html>
