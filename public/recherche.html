<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-body">
    <div class="wrap" style="padding-top:40px">
      <h1 id="search-title">Recherche</h1>
      <div id="results"><div class="loader">Recherche en cours…</div></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      const user = await initLayout({ activeKey: '', requireAuth: true });
      if (!user) return;
      const q = new URLSearchParams(window.location.search).get('q') || '';
      document.getElementById('search-title').textContent = q ? `Résultats pour "${q}"` : 'Recherche';
      if (!q) { document.getElementById('results').innerHTML = '<div class="empty-state">Saisissez un terme dans la barre de recherche.</div>'; return; }
      runSearch(q);
    })();

    async function runSearch(q) {
      const container = document.getElementById('results');
      try {
        const { casiers, sanctions, membres } = await api(`/recherche?q=${encodeURIComponent(q)}`);
        const total = casiers.length + sanctions.length + membres.length;
        if (total === 0) {
          container.innerHTML = '<div class="empty-state">Aucun résultat.</div>';
          return;
        }

        let html = '';
        if (casiers.length) {
          html += `<h2 style="font-size:1.1rem">Casiers judiciaires</h2><div class="grid grid-3" style="margin-bottom:24px">`;
          html += casiers.map(c => `
            <a href="casier-detail.html?id=${c.id}" class="dossier" data-tab="Dossier">
              <h3>${escapeHtml(c.nom)} ${escapeHtml(c.prenom || '')}</h3>
              ${c.surnom ? `<div class="meta">dit "${escapeHtml(c.surnom)}"</div>` : ''}
              <span class="badge badge-muted">${escapeHtml(c.statut)}</span>
            </a>`).join('');
          html += `</div>`;
        }
        if (sanctions.length) {
          html += `<h2 style="font-size:1.1rem">Code pénal</h2><div class="table-wrap" style="margin-bottom:24px"><table><thead><tr><th>Art.</th><th>Infraction</th><th>Code</th></tr></thead><tbody>`;
          html += sanctions.map(s => `<tr><td style="font-family:var(--font-mono)">${escapeHtml(s.article || '—')}</td><td>${escapeHtml(s.nom)}</td><td>${escapeHtml(s.code_juridique)}</td></tr>`).join('');
          html += `</tbody></table></div>`;
        }
        if (membres.length) {
          html += `<h2 style="font-size:1.1rem">Membres</h2><div class="grid grid-3">`;
          html += membres.map(m => `
            <div class="card">
              <strong>${escapeHtml(m.nom_complet || m.username)}</strong>
              <p class="muted mb-0" style="font-size:0.82rem">${escapeHtml(m.grade_nom || 'Sans grade')}</p>
            </div>`).join('');
          html += `</div>`;
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
