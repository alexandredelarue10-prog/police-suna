<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-page">
    <div class="doc-card" style="max-width:400px; width:100%;" id="login-card">
      <div class="text-center" style="margin-bottom:20px">
        <div class="sceau" style="margin:0 auto 12px"></div>
        <h2 class="mb-0">Connexion</h2>
        <p class="field-hint">Accès réservé aux agents enregistrés.</p>
      </div>

      <div id="form-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Se connecter</button>
      </form>

      <p class="text-center" style="margin-top:18px; font-size:0.85rem" id="register-hint">
        Pas encore de compte ? <a href="register.html">Demander un accès</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async function () {
      // Si déjà connecté, redirige directement vers le tableau de bord
      await fetchCurrentUser();
      if (CURRENT_USER) { window.location.href = 'dashboard.html'; return; }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('form-error');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion…';

      try {
        await api('/auth/login', {
          method: 'POST',
          body: {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        window.location.href = 'dashboard.html';
      } catch (err) {
        if (err.message === 'Le parchemin ne reçoit plus le chakra de son propriétaire.') {
          showChakraLockout();
          return;
        }
        errorBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });

    // Message RP en grand format, remplace tout le formulaire — pas une simple petite alerte,
    // pour marquer le coup quand le chakra du village est coupé.
    function showChakraLockout() {
      document.getElementById('login-card').innerHTML = `
        <div class="text-center" style="padding:16px 4px">
          <div style="font-size:3.2rem; line-height:1; margin-bottom:6px">⚡</div>
          <h1 style="font-size:1.5rem; color:var(--sceau-600); margin-bottom:14px">Le chakra a été coupé</h1>
          <p style="font-size:1.05rem; line-height:1.5">Le parchemin ne reçoit plus le chakra de son propriétaire.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
