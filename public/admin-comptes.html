<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des comptes — Police de Sunagakure</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-body">
    <div class="wrap" style="padding-top:40px">
      <h1>Gestion des comptes</h1>
      <p class="muted" style="margin-bottom:28px">Validez les demandes d'accès, attribuez les grades, ou supprimez des comptes.</p>

      <div class="section-head">
        <h2 class="mb-0" style="font-size:1.15rem">Demandes en attente</h2>
      </div>
      <div id="pending-list" style="margin-bottom:40px"><div class="loader">Chargement…</div></div>

      <div class="section-head">
        <h2 class="mb-0" style="font-size:1.15rem">Tous les comptes</h2>
      </div>
      <div class="table-wrap">
        <table id="users-table">
          <thead>
            <tr><th>Utilisateur</th><th>Nom complet</th><th>Grade (poste)</th><th>Rang ninja</th><th>Pôles</th><th>Discord</th><th>Rôle judiciaire</th><th>Statut</th><th>Matricule</th><th></th></tr>
          </thead>
          <tbody><tr><td colspan="10" class="loader">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="dossier-modal">
    <div class="modal">
      <h3>Dossier disciplinaire — <span id="dossier-username"></span></h3>
      <div id="dossier-list" style="margin-bottom:18px"></div>
      <form id="dossier-form" class="dark-form" style="background:rgba(0,0,0,0.03); padding:14px; border-radius:4px">
        <div class="field">
          <label for="d-niveau">Appliquer un nouveau blâme</label>
          <select id="d-niveau"></select>
        </div>
        <div class="field">
          <label for="d-motif">Motif</label>
          <input type="text" id="d-motif" placeholder="Raison du blâme" />
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Appliquer</button>
      </form>
      <div class="modal-close-row">
        <button type="button" class="btn btn-secondary" id="dossier-close">Fermer</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    let gradesCache = [];
    let rangsCache = [];
    let polesCache = [];
    let rolesJudCache = [];
    let currentUserId = null;
    let isFondateur = false;

    (async function () {
      const user = await initLayout({ activeKey: 'admin-comptes', requireAuth: true, requirePerm: 'peut_valider_comptes' });
      if (!user) return;
      currentUserId = user.id;
      isFondateur = user.grade_nom === 'Fondateur';
      if (isFondateur) {
        // Fonction RP réservée au Fondateur : colonne ajoutée dynamiquement, invisible pour tout autre grade.
        document.querySelector('#users-table thead tr').insertAdjacentHTML('beforeend', '<th>Chakra</th>');
        document.querySelectorAll('#users-table tbody td[colspan]').forEach(td => td.setAttribute('colspan', '11'));
      }
      const [{ grades }, { rangs }, { poles }, { roles }] = await Promise.all([api('/grades'), api('/rangs'), api('/poles'), api('/roles-judiciaires')]);
      gradesCache = grades;
      rangsCache = rangs;
      polesCache = poles;
      rolesJudCache = roles;
      loadUsers();
      onLive(['users'], loadUsers);

      document.getElementById('dossier-close').addEventListener('click', () => document.getElementById('dossier-modal').classList.remove('open'));
      document.getElementById('dossier-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = document.getElementById('dossier-modal').dataset.userId;
        try {
          await api(`/users/${userId}/blames`, {
            method: 'POST',
            body: { blame_niveau: parseInt(document.getElementById('d-niveau').value), motif: document.getElementById('d-motif').value.trim() },
          });
          toast('Blâme appliqué.');
          document.getElementById('d-motif').value = '';
          const { blames } = await api(`/users/${userId}/blames`);
          renderDossier(blames);
        } catch (err) { toast(err.message, 'error'); }
      });
    })();

    const statutLabels = {
      en_attente: ['En attente', 'badge-warn'],
      approuve: ['Approuvé', 'badge-ok'],
      refuse: ['Refusé', 'badge-danger'],
    };

    // Les grades réservés (ex : Fondateur) n'apparaissent jamais dans les listes d'attribution.
    function gradeSelectHtml(selectedId) {
      const assignable = gradesCache.filter(g => !g.reserve);
      return `<select class="grade-select">
        <option value="">— Aucun grade —</option>
        ${assignable.map(g => `<option value="${g.id}" ${String(g.id) === String(selectedId) ? 'selected' : ''}>${escapeHtml(g.nom)}</option>`).join('')}
      </select>`;
    }

    function rangSelectHtml(selectedId) {
      return `<select class="rang-select">
        <option value="">— Aucun —</option>
        ${rangsCache.map(r => `<option value="${r.id}" ${String(r.id) === String(selectedId) ? 'selected' : ''}>${escapeHtml(r.nom)}</option>`).join('')}
      </select>`;
    }

    function polesCheckboxHtml(userPoles) {
      const currentIds = (userPoles || []).map(p => p.id);
      return `<div class="flex gap-8" style="flex-wrap:wrap; align-items:center">
        ${polesCache.map(p => `
          <label style="display:flex; align-items:center; gap:4px; text-transform:none; font-weight:400; font-size:0.78rem; cursor:pointer">
            <input type="checkbox" class="pole-check" value="${p.id}" style="width:auto" ${currentIds.includes(p.id) ? 'checked' : ''} />
            <span class="grade-dot" style="background:${p.couleur}; width:8px; height:8px"></span>${escapeHtml(p.nom)}
          </label>
        `).join('')}
      </div>`;
    }

    // Champ ID Discord : éditable uniquement si le compte connecté a la permission dédiée
    function discordCellHtml(u) {
      if (!CURRENT_USER.permissions.peut_gerer_id_discord) {
        return `<span class="muted" style="font-size:0.8rem">${escapeHtml(u.discord_id || '—')}</span>`;
      }
      return `<div class="flex gap-8" style="align-items:center">
        <input type="text" class="discord-input" value="${escapeHtml(u.discord_id || '')}" placeholder="ID Discord" style="width:150px; font-size:0.78rem" />
        <button class="btn btn-secondary btn-sm" data-save-discord="${u.id}">OK</button>
      </div>`;
    }

    // Rôle judiciaire : select éditable uniquement si le compte connecté a la permission dédiée
    function roleJudCellHtml(u) {
      if (!CURRENT_USER.permissions.peut_gerer_judiciaire) {
        return `<span class="muted" style="font-size:0.8rem">${escapeHtml(u.role_judiciaire_nom || '—')}</span>`;
      }
      return `<select class="role-jud-select">
        <option value="">— Aucun —</option>
        ${rolesJudCache.map(r => `<option value="${r.id}" ${String(r.id) === String(u.role_judiciaire_id) ? 'selected' : ''}>${escapeHtml(r.nom)}</option>`).join('')}
      </select>`;
    }

    // Fonction RP réservée au Fondateur : coupe/rétablit le chakra du parchemin (bloque la connexion)
    function chakraCellHtml(u) {
      if (u.protege) return `<span class="muted" title="Compte protégé">— 🔒</span>`;
      return u.chakra_coupe
        ? `<span class="badge badge-danger" style="margin-right:6px">Chakra coupé</span><button class="btn btn-secondary btn-sm" data-toggle-chakra="${u.id}" data-next="false">Rétablir</button>`
        : `<button class="btn btn-secondary btn-sm" data-toggle-chakra="${u.id}" data-next="true">Couper le chakra</button>`;
    }

    async function loadUsers() {
      try {
        const { users } = await api('/users');
        renderPending(users.filter(u => u.statut === 'en_attente'));
        renderTable(users);
      } catch (err) {
        document.getElementById('pending-list').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderPending(pending) {
      const container = document.getElementById('pending-list');
      if (pending.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune demande en attente.</div>';
        return;
      }
      container.innerHTML = pending.map(u => `
        <div class="card" style="margin-bottom:12px">
          <div class="flex-between" style="flex-wrap:wrap; gap:14px">
            <div>
              <strong>${escapeHtml(u.username)}</strong>
              <p class="muted mb-0" style="font-size:0.82rem">${escapeHtml(u.nom_complet || 'Sans nom')} · demandé le ${formatDate(u.created_at)}</p>
            </div>
            <div class="flex gap-8" style="align-items:center; flex-wrap:wrap">
              ${gradeSelectHtml('')}
              ${rangSelectHtml('')}
              <button class="btn btn-primary btn-sm" data-approve="${u.id}">Valider</button>
              <button class="btn btn-danger btn-sm" data-reject="${u.id}">Refuser</button>
            </div>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('[data-approve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('.card');
          const gradeSelect = card.querySelector('.grade-select');
          const rangSelect = card.querySelector('.rang-select');
          if (!gradeSelect.value) { toast('Choisissez un grade avant de valider.', 'error'); return; }
          try {
            await api(`/users/${btn.dataset.approve}/approve`, {
              method: 'POST',
              body: { grade_id: gradeSelect.value, rang_id: rangSelect.value || null },
            });
            toast('Compte validé.');
            loadUsers();
          } catch (err) { toast(err.message, 'error'); }
        });
      });
      container.querySelectorAll('[data-reject]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Refuser cette demande de compte ?')) return;
          try {
            await api(`/users/${btn.dataset.reject}/reject`, { method: 'POST' });
            toast('Demande refusée.');
            loadUsers();
          } catch (err) { toast(err.message, 'error'); }
        });
      });
    }

    function renderTable(users) {
      const tbody = document.querySelector('#users-table tbody');
      const approved = users.filter(u => u.statut !== 'en_attente');
      if (approved.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isFondateur ? 11 : 10}" class="empty-state">Aucun compte.</td></tr>`;
        return;
      }
      tbody.innerHTML = approved.map(u => {
        const [label, cls] = statutLabels[u.statut] || ['—', 'badge-muted'];
        const locked = u.protege || u.id === currentUserId;
        const lockReason = u.protege ? 'Compte protégé' : 'Vous ne pouvez pas modifier votre propre grade/rang/pôles';
        return `
          <tr>
            <td>${escapeHtml(u.username)}${u.protege ? ' <span class="badge badge-warn">Protégé</span>' : ''}<div class="muted" style="font-size:0.72rem">${u.last_login ? 'Connecté le ' + formatDate(u.last_login) : 'Jamais connecté'}</div></td>
            <td>${escapeHtml(u.nom_complet || '—')}</td>
            <td>${locked ? `<span class="muted" title="${lockReason}">${escapeHtml(u.grade_nom || '—')} 🔒</span>` : gradeSelectHtml(u.grade_id)}</td>
            <td>${locked ? `<span class="muted" title="${lockReason}">${escapeHtml(u.rang_nom || '—')} 🔒</span>` : rangSelectHtml(u.rang_id)}</td>
            <td>
              ${locked
                ? `<span class="muted" title="${lockReason}">${(u.poles || []).map(p => escapeHtml(p.nom)).join(', ') || '—'} 🔒</span>`
                : `<div class="pole-cell">${polesCheckboxHtml(u.poles)}<button class="btn btn-secondary btn-sm" data-save-poles="${u.id}" style="margin-top:4px">Enregistrer</button></div>`}
            </td>
            <td>${discordCellHtml(u)}</td>
            <td>${roleJudCellHtml(u)}</td>
            <td><span class="badge ${cls}">${label}</span></td>
            <td style="font-family:var(--font-mono); font-size:0.8rem">${escapeHtml(u.matricule || '—')}</td>
            <td>${u.protege ? '' : `<div class="flex gap-8"><button class="btn btn-secondary btn-sm" data-dossier="${u.id}" data-username="${escapeHtml(u.username)}">Dossier</button><button class="btn btn-danger btn-sm" data-delete="${u.id}">Supprimer</button></div>`}</td>
            ${isFondateur ? `<td>${chakraCellHtml(u)}</td>` : ''}
          </tr>`;
      }).join('');

      tbody.querySelectorAll('.grade-select').forEach((select) => {
        const row = select.closest('tr');
        const idx = [...tbody.children].indexOf(row);
        select.addEventListener('change', async () => {
          try {
            await api(`/users/${approved[idx].id}/grade`, { method: 'PATCH', body: { grade_id: select.value || null } });
            toast('Grade mis à jour.');
          } catch (err) { toast(err.message, 'error'); loadUsers(); }
        });
      });
      tbody.querySelectorAll('.rang-select').forEach((select) => {
        const row = select.closest('tr');
        const idx = [...tbody.children].indexOf(row);
        select.addEventListener('change', async () => {
          try {
            await api(`/users/${approved[idx].id}/rang`, { method: 'PATCH', body: { rang_id: select.value || null } });
            toast('Rang ninja mis à jour.');
          } catch (err) { toast(err.message, 'error'); loadUsers(); }
        });
      });
      tbody.querySelectorAll('[data-save-poles]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('tr');
          const checkedIds = [...row.querySelectorAll('.pole-check:checked')].map(c => parseInt(c.value));
          try {
            await api(`/users/${btn.dataset.savePoles}/poles`, { method: 'PATCH', body: { pole_ids: checkedIds } });
            toast('Pôles mis à jour.');
            loadUsers();
          } catch (err) { toast(err.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.role-jud-select').forEach((select) => {
        const row = select.closest('tr');
        const idx = [...tbody.children].indexOf(row);
        select.addEventListener('change', async () => {
          try {
            await api(`/users/${approved[idx].id}/role-judiciaire`, { method: 'PATCH', body: { role_judiciaire_id: select.value || null } });
            toast('Rôle judiciaire mis à jour.');
          } catch (err) { toast(err.message, 'error'); loadUsers(); }
        });
      });
      tbody.querySelectorAll('[data-save-discord]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('tr');
          const input = row.querySelector('.discord-input');
          const value = input.value.trim();
          try {
            await api(`/users/${btn.dataset.saveDiscord}/discord`, { method: 'PATCH', body: { discord_id: value || null } });
            toast('ID Discord enregistré.');
          } catch (err) { toast(err.message, 'error'); }
        });
      });
      tbody.querySelectorAll('[data-toggle-chakra]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const next = btn.dataset.next === 'true';
          if (next && !confirm('Couper le chakra de ce parchemin ? Le compte ne pourra plus se connecter tant que le chakra n\'est pas rétabli.')) return;
          try {
            await api(`/users/${btn.dataset.toggleChakra}/chakra`, { method: 'PATCH', body: { chakra_coupe: next } });
            toast(next ? 'Chakra coupé.' : 'Chakra rétabli.');
            loadUsers();
          } catch (err) { toast(err.message, 'error'); }
        });
      });
      tbody.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Supprimer définitivement ce compte ?')) return;
          try {
            await api(`/users/${btn.dataset.delete}`, { method: 'DELETE' });
            toast('Compte supprimé.');
            loadUsers();
          } catch (err) { toast(err.message, 'error'); }
        });
      });
      tbody.querySelectorAll('[data-dossier]').forEach(btn => {
        btn.addEventListener('click', () => openDossier(btn.dataset.dossier, btn.dataset.username));
      });
    }

    let blameTypesCache = [];
    async function openDossier(userId, username) {
      document.getElementById('dossier-username').textContent = username;
      document.getElementById('dossier-modal').dataset.userId = userId;
      document.getElementById('dossier-list').innerHTML = '<div class="loader">Chargement…</div>';
      document.getElementById('dossier-modal').classList.add('open');

      if (blameTypesCache.length === 0) {
        try { blameTypesCache = (await api('/blames')).blames; } catch (_) { /* silencieux */ }
        const select = document.getElementById('d-niveau');
        select.innerHTML = blameTypesCache.map(b => `<option value="${b.niveau}">Blâme ${b.niveau} — ${escapeHtml(b.description.slice(0, 40))}${b.description.length > 40 ? '…' : ''}</option>`).join('');
      }

      try {
        const { blames } = await api(`/users/${userId}/blames`);
        renderDossier(blames);
      } catch (err) {
        document.getElementById('dossier-list').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderDossier(blames) {
      const container = document.getElementById('dossier-list');
      if (blames.length === 0) {
        container.innerHTML = '<p class="muted" style="font-size:0.85rem">Aucun blâme enregistré.</p>';
        return;
      }
      container.innerHTML = blames.map(b => `
        <div class="flex-between" style="padding:10px 0; border-bottom:1px solid rgba(23,21,15,0.12)">
          <div>
            <span class="badge badge-warn">Blâme ${b.blame_niveau}</span>
            <p class="mb-0" style="font-size:0.82rem; margin-top:4px">${escapeHtml(b.motif || '—')}</p>
            <p class="muted mb-0" style="font-size:0.75rem">${formatDate(b.created_at)} par ${escapeHtml(b.applique_par_username || '—')}</p>
          </div>
          <button class="btn btn-danger btn-sm" data-del-blame="${b.id}">Retirer</button>
        </div>
      `).join('');
      container.querySelectorAll('[data-del-blame]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Retirer ce blâme du dossier ?')) return;
          const userId = document.getElementById('dossier-modal').dataset.userId;
          try {
            await api(`/users/blames/${btn.dataset.delBlame}`, { method: 'DELETE' });
            toast('Blâme retiré.');
            const { blames } = await api(`/users/${userId}/blames`);
            renderDossier(blames);
          } catch (err) { toast(err.message, 'error'); }
        });
      });
    }
  </script>
</body>
</html>
