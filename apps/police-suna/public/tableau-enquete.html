<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau d'enquête — police-suna</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    #board-viewport {
      position: relative;
      overflow: auto;
      height: calc(100vh - 64px);
      background: #2a2016;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #board-inner {
      position: relative;
      width: 3000px;
      height: 2000px;
    }
    #board-svg {
      position: absolute;
      top: 0; left: 0;
      width: 3000px;
      height: 2000px;
      pointer-events: none;
    }
    .note {
      position: absolute;
      width: 220px;
      padding: 12px;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: grab;
      font-family: var(--font-body);
      user-select: none;
    }
    .note.dragging { cursor: grabbing; opacity: 0.9; z-index: 50; }
    .note.linking-source { outline: 3px solid var(--sceau-600); }
    .note textarea, .note input {
      width: 100%;
      background: transparent;
      border: none;
      font-family: var(--font-body);
      color: var(--nuit-900);
      resize: none;
    }
    .note input { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .note textarea { font-size: 0.82rem; min-height: 60px; }
    .note-toolbar { display: flex; justify-content: space-between; margin-top: 6px; }
    .note-toolbar button {
      background: rgba(0,0,0,0.12);
      border: none;
      border-radius: 3px;
      font-size: 0.7rem;
      padding: 3px 7px;
      cursor: pointer;
      color: var(--nuit-900);
    }
    .board-toolbar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }
  </style>
<script defer src="/assets/annonce.js"></script></head>
<body>
  <div class="page-body">
    <div id="board-viewport">
      <svg id="board-svg"></svg>
      <div id="board-inner"></div>
    </div>
  </div>

  <div class="board-toolbar">
    <button class="btn btn-primary" id="new-note-btn">+ Nouvelle note</button>
    <button class="btn btn-secondary" id="link-mode-btn">🔗 Relier deux notes</button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    let notesCache = [];
    let connexionsCache = [];
    let linkMode = false;
    let linkSourceId = null;

    (async function () {
      const user = await initLayout({ activeKey: '', requireAuth: true });
      if (!user || user.username !== 'DEV') { window.location.href = 'dashboard.html'; return; }
      document.getElementById('new-note-btn').addEventListener('click', createNote);
      document.getElementById('link-mode-btn').addEventListener('click', toggleLinkMode);
      load();
    })();

    async function load() {
      try {
        const { notes, connexions } = await api('/tableau');
        notesCache = notes;
        connexionsCache = connexions;
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    function toggleLinkMode() {
      linkMode = !linkMode;
      linkSourceId = null;
      document.getElementById('link-mode-btn').className = linkMode ? 'btn btn-primary' : 'btn btn-secondary';
      render();
    }

    async function createNote() {
      const viewport = document.getElementById('board-viewport');
      const pos_x = viewport.scrollLeft + 120;
      const pos_y = viewport.scrollTop + 100;
      try {
        const { note } = await api('/tableau/notes', { method: 'POST', body: { titre: 'Nouvelle piste', contenu: '', pos_x, pos_y, couleur: '#EFE3C6' } });
        notesCache.push(note);
        render();
      } catch (err) { alert(err.message); }
    }

    function render() {
      const inner = document.getElementById('board-inner');
      inner.innerHTML = '';

      notesCache.forEach((note) => {
        const el = document.createElement('div');
        el.className = 'note' + (linkMode && linkSourceId === note.id ? ' linking-source' : '');
        el.style.left = note.pos_x + 'px';
        el.style.top = note.pos_y + 'px';
        el.style.background = note.couleur;
        el.dataset.id = note.id;
        el.innerHTML = `
          <input type="text" value="${escapeHtml(note.titre)}" data-field="titre" />
          <textarea data-field="contenu">${escapeHtml(note.contenu)}</textarea>
          <div class="note-toolbar">
            <button data-del="${note.id}">Supprimer</button>
            <span class="muted" style="font-size:0.68rem">#${note.id}</span>
          </div>
        `;
        inner.appendChild(el);

        // Édition : sauvegarde au blur (perte de focus), pas de bouton "enregistrer"
        el.querySelectorAll('[data-field]').forEach((field) => {
          field.addEventListener('pointerdown', (e) => e.stopPropagation());
          field.addEventListener('blur', () => saveNoteField(note.id, field.dataset.field, field.value));
        });
        el.querySelector('[data-del]').addEventListener('pointerdown', (e) => e.stopPropagation());
        el.querySelector('[data-del]').addEventListener('click', () => deleteNote(note.id));

        el.addEventListener('pointerdown', (e) => startDrag(e, note, el));
        el.addEventListener('click', (e) => { if (linkMode) handleLinkClick(note.id); });
      });

      drawConnexions();
    }

    function drawConnexions() {
      const svg = document.getElementById('board-svg');
      const centerOf = (id) => {
        const n = notesCache.find((x) => x.id === id);
        if (!n) return null;
        return { x: n.pos_x + 110, y: n.pos_y + 55 };
      };
      svg.innerHTML = connexionsCache.map((c) => {
        const a = centerOf(c.note_a_id);
        const b = centerOf(c.note_b_id);
        if (!a || !b) return '';
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        return `
          <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#B8642E" stroke-width="2" opacity="0.75" />
          ${c.label ? `<text x="${midX}" y="${midY}" fill="#EFE3C6" font-size="11" text-anchor="middle" style="pointer-events:auto; cursor:pointer" data-del-connexion="${c.id}">${escapeHtml(c.label)}</text>` : ''}
        `;
      }).join('');
      svg.querySelectorAll('[data-del-connexion]').forEach((el) => {
        el.addEventListener('click', () => deleteConnexion(el.dataset.delConnexion));
      });
    }

    async function handleLinkClick(noteId) {
      if (!linkSourceId) {
        linkSourceId = noteId;
        render();
        return;
      }
      if (linkSourceId === noteId) { linkSourceId = null; render(); return; }
      const label = prompt('Légende du lien (optionnel) :') || '';
      try {
        const { connexion } = await api('/tableau/connexions', { method: 'POST', body: { note_a_id: linkSourceId, note_b_id: noteId, label } });
        connexionsCache.push(connexion);
      } catch (err) { alert(err.message); }
      linkSourceId = null;
      render();
    }

    async function deleteConnexion(id) {
      if (!confirm('Supprimer ce lien ?')) return;
      try {
        await api(`/tableau/connexions/${id}`, { method: 'DELETE' });
        connexionsCache = connexionsCache.filter((c) => String(c.id) !== String(id));
        render();
      } catch (err) { alert(err.message); }
    }

    async function saveNoteField(id, field, value) {
      const note = notesCache.find((n) => n.id === id);
      if (!note) return;
      note[field] = value;
      try {
        await api(`/tableau/notes/${id}`, { method: 'PUT', body: note });
      } catch (err) { alert(err.message); }
    }

    async function deleteNote(id) {
      if (!confirm('Supprimer cette note et ses liens ?')) return;
      try {
        await api(`/tableau/notes/${id}`, { method: 'DELETE' });
        notesCache = notesCache.filter((n) => n.id !== id);
        connexionsCache = connexionsCache.filter((c) => c.note_a_id !== id && c.note_b_id !== id);
        render();
      } catch (err) { alert(err.message); }
    }

    // --- Glisser-déposer (pointer events : souris + tactile) ---
    let dragState = null;

    function startDrag(e, note, el) {
      if (linkMode) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      dragState = {
        note, el,
        startX: e.clientX, startY: e.clientY,
        origX: note.pos_x, origY: note.pos_y,
      };
      el.addEventListener('pointermove', onDrag);
      el.addEventListener('pointerup', endDrag);
    }

    function onDrag(e) {
      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      dragState.note.pos_x = Math.max(0, dragState.origX + dx);
      dragState.note.pos_y = Math.max(0, dragState.origY + dy);
      dragState.el.style.left = dragState.note.pos_x + 'px';
      dragState.el.style.top = dragState.note.pos_y + 'px';
      drawConnexions();
    }

    async function endDrag(e) {
      if (!dragState) return;
      const { note, el } = dragState;
      el.classList.remove('dragging');
      el.removeEventListener('pointermove', onDrag);
      el.removeEventListener('pointerup', endDrag);
      dragState = null;
      try {
        await api(`/tableau/notes/${note.id}`, { method: 'PUT', body: note });
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
